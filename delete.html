<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenna Orr | Software Developer</title>
    <meta name="description" content="Professional portfolio of Jenna Orr, Software Developer">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                fontFamily: {
                    sans: ['Inter', 'sans-serif'],
                },
                extend: {
                    colors: {
                        beige: "#F5F5F0",
                        tan: "#E8E3D5",
                        accent: "#D8C7B5",
                        dark: "#3A3A3A"
                    },
                    animation: {
                        'fade-in': 'fadeIn 1s ease-in-out',
                        'slide-left': 'slideLeft 0.8s ease-out',
                        'slide-right': 'slideRight 0.8s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideLeft: {
                            '0%': { transform: 'translateX(50px)', opacity: '0' },
                            '100%': { transform: 'translateX(0)', opacity: '1' }
                        },
                        slideRight: {
                            '0%': { transform: 'translateX(-50px)', opacity: '0' },
                            '100%': { transform: 'translateX(0)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html {
            scroll-behavior: smooth;
        }
        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #D8C7B5, transparent);
        }
        .photo-frame {
            position: relative;
            border: 15px solid #F5F5F0;
            box-shadow: 8px 8px 0 #E8E3D5;
            margin-left: 30px;
            margin-top: 30px;
        }
        .photo-frame::before {
            content: "";
            position: absolute;
            top: -30px;
            left: -30px;
            right: 30px;
            bottom: 30px;
            border: 1px solid #D8C7B5;
            z-index: -1;
        }
    </style>
</head>

<body class="bg-beige text-dark font-sans">

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 bg-beige z-50 shadow-sm">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <a href="index.html" class="text-xl font-semibold">Jenna Orr</a>

                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-8">
                    <a href="about.html" class="hover:text-accent transition duration-300">About</a>
                    <a href="experience.html" class="hover:text-accent transition duration-300">Experience</a>
                    <a href="contact.html" class="hover:text-accent transition duration-300">Contact</a>
                </div>

                <!-- Mobile Menu Button -->
                <button id="mobile-menu-btn" class="md:hidden focus:outline-none">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Dropdown Menu -->
        <div id="mobile-menu" class="md:hidden hidden px-6 pb-4 bg-beige border-t border-accent">
            <a href="about.html" class="block py-2 hover:text-accent">About</a>
            <a href="experience.html" class="block py-2 hover:text-accent">Experience</a>
            <a href="contact.html" class="block py-2 hover:text-accent">Contact</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-20">
        <div class="container mx-auto px-6 py-12 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-6 animate-fade-in">Software Developer</h1>
            <p class="text-lg md:text-xl max-w-2xl mx-auto animate-fade-in">
                Creating elegant solutions to complex problems through clean, efficient code.
            </p>
            <div class="mt-12 animate-fade-in">
                <a href="about.html" class="inline-block px-6 py-3 bg-accent text-dark font-medium hover:bg-opacity-90 transition duration-300">
                    Explore My Work
                </a>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/scrollreveal"></script>
    <script>
        // Scroll reveal animations
        ScrollReveal().reveal('.animate-fade-in', { 
            delay: 200,
            duration: 1000,
            easing: 'ease-in-out'
        });

        // Mobile menu toggle
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });
    </script>

</body>
</html>
