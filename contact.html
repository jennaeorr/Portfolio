<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Jenna Orr</title>
    <meta name="description" content="Contact Jenna Orr, Software Developer">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            background: #F9F0EA;
            color: #4C392D;
            font-family: 'Inter', sans-serif;
        }

        nav {
            background: #DDDAD3;
        }
        nav a { transition: color 0.3s; }
        nav a:hover { color: #9E8472; }

        .contact-card {
            border-top: 4px solid #A89D92;
            background: rgba(221,218,211,0.95);
            transition: all 0.3s ease;
        }
        .contact-card:hover { transform: translateY(-5px); }

        .form-input {
            border-bottom: 2px solid #A89D92;
            transition: all 0.3s ease;
        }
        .form-input:focus { border-bottom-color: #4C392D; }

        .text-accent { color: #9E8472; }

        button {
            background: #9E8472;
            color: #F9F0EA;
            transition: all 0.3s ease;
        }
        button:hover { opacity: 0.9; }

        footer { background: #DDDAD3; }

        /* --- Glistening Heading --- */
        .hero-name {
            font-family: 'Amatic SC', cursive;
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #9E8472, #DDDAD3, #9E8472);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s ease-in-out infinite;
            display: inline-block;
            position: relative;
            z-index: 1;
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero-name::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 60%;
            background: rgba(255, 240, 220, 0.2);
            filter: blur(40px);
            z-index: -1;
            border-radius: 50%;
        }

        @keyframes shine {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
<nav class="fixed top-0 left-0 right-0 z-50 bg-[#DDDAD3] shadow-sm">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">
    <a href="index.html" class="text-xl font-semibold">Jenna Orr</a>

    <!-- Desktop Links -->
    <div class="hidden md:flex space-x-8">
      <a href="index.html" class="hover:text-[#9E8472] transition duration-300">About</a>
      <a href="experience.html" class="hover:text-[#9E8472] transition duration-300">Experience</a>
      <a href="contact.html" class="text-[#9E8472] font-medium transition duration-300">Contact</a>
    </div>

    <!-- Mobile Hamburger -->
    <button id="menu-btn" class="md:hidden focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>

  <!-- Mobile Links -->
  <div id="mobile-menu" class="hidden md:hidden bg-[#DDDAD3]">
    <a href="index.html" class="block px-6 py-3 border-t border-[#CCC] hover:text-[#9E8472] transition duration-300">About</a>
    <a href="experience.html" class="block px-6 py-3 border-t border-[#CCC] hover:text-[#9E8472] transition duration-300">Experience</a>
    <a href="contact.html" class="block px-6 py-3 border-t border-[#CCC] text-[#9E8472] font-medium transition duration-300">Contact</a>
  </div>
</nav>

<script>
  const menuBtn = document.getElementById('menu-btn');
  const mobileMenu = document.getElementById('mobile-menu');

  menuBtn.addEventListener('click', () => {
    mobileMenu.classList.toggle('hidden');
    mobileMenu.classList.toggle('animate-slide-down');
  });
</script>

<style>
  @keyframes slide-down {
    0% { transform: translateY(-10px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  .animate-slide-down {
    animation: slide-down 0.3s ease-out;
  }
</style>

    <main class="pt-20 pb-16">
        <div class="container mx-auto px-6">
            <div class="flex justify-center mb-12">
				<h1 class="hero-name">Get In Touch</h1>
			</div>

            <div class="flex flex-col lg:flex-row gap-12">
                <!-- Contact Info -->
                <div class="lg:w-1/2">
                    <div class="contact-card p-8 mb-8 scroll-reveal">
                        <h2 class="text-2xl font-bold mb-6">Contact Information</h2>
                        <div class="space-y-6">
                            <div class="flex items-start">
                                <div class="mr-4 mt-1">
                                    <i class="fas fa-phone text-accent text-xl"></i>
                                </div>
                                <div>
                                    <h3 class="font-medium text-lg">Phone</h3>
                                    <p>(480)766-3690</p>
                                </div>
                            </div>
                            <div class="flex items-start">
                                <div class="mr-4 mt-1">
                                    <i class="fas fa-envelope text-accent text-xl"></i>
                                </div>
                                <div>
                                    <h3 class="font-medium text-lg">Email</h3>
                                    <p>jspero2001@gmail.com</p>
                                </div>
                            </div>
                            <div class="flex items-start">
                                <div class="mr-4 mt-1">
                                    <i class="fas fa-map-marker-alt text-accent text-xl"></i>
                                </div>
                                <div>
                                    <h3 class="font-medium text-lg">Location</h3>
                                    <p>Clovis, NM</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="contact-card p-8 scroll-reveal">
                        <div class="flex items-center space-x-4">
                            <h2 class="text-2xl font-bold m-0">Connect With Me</h2>
                            <a href="http://www.linkedin.com/in/jennaeorr" class="text-2xl hover:text-accent transition duration-300">
                                <i class="fab fa-linkedin"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Contact Form -->
                <div class="lg:w-1/2 scroll-reveal">
                    <div class="contact-card p-8">
                        <h2 class="text-2xl font-bold mb-6">Send Me a Message</h2>
                        <form action="https://formspree.io/f/xqeakqvr" method="POST" class="space-y-6">
							<input type="hidden" name="_subject" value="New Contact Message from Portfolio">
                            <div>
                                <label for="name" class="block mb-2 font-medium">Name</label>
                                <input type="text" id="name" name="name" required 
                                    class="w-full px-4 py-3 form-input bg-transparent focus:outline-none">
                            </div>
                            <div>
                                <label for="email" class="block mb-2 font-medium">Email</label>
                                <input type="email" id="email" name="email" required 
                                    class="w-full px-4 py-3 form-input bg-transparent focus:outline-none">
                            </div>
                            <div>
                                <label for="message" class="block mb-2 font-medium">Message</label>
                                <textarea id="message" name="message" rows="5" required 
                                    class="w-full px-4 py-3 form-input bg-transparent focus:outline-none"></textarea>
                            </div>
                            <button type="submit" class="px-6 py-3 font-medium">
                                Send Message
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-8 text-center">
        <div class="container mx-auto px-6">
            <p>&copy; 2025 Jenna Orr. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/scrollreveal"></script>
    <script>
        // Scroll animations
        ScrollReveal().reveal('.scroll-reveal', {
            delay: 200,
            distance: '30px',
            origin: 'bottom',
            duration: 800,
            interval: 100
        });
    </script>
</body>
</html>
