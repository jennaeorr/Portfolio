<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Jenna Orr</title>
<meta name="description" content="Contact Jenna Orr, Software Developer">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Raleway:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/a2d9d5a64b.js" crossorigin="anonymous"></script>

<style>
  body { font-family:'Inter',sans-serif; background:#F9F0EA; color:#4C392D; overflow-x:hidden; }
  body::before { content:''; position:fixed; top:0; left:0; right:0; bottom:0;
    background-image: linear-gradient(45deg, rgba(255,255,255,0.03) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0.03) 75%, transparent 75%, transparent);
    background-size:20px 20px; pointer-events:none; z-index:-1;
  }

  nav { background:#DDDAD3; }
  nav a { transition:color 0.3s; }
  nav a:hover { color:#9E8472; }

  #mobile-menu { display:none; }

  .hero-bg { background: linear-gradient(135deg, #F9F0EA 0%, #DDDAD3 100%);
    border-radius: 20px; padding: 4rem 2rem 5rem 2rem; margin:6rem 2rem 3rem 2rem;
    overflow:hidden; display:flex; flex-direction:column; align-items:center; gap:2rem; position:relative;
    box-shadow: inset 0 0 60px rgba(255,255,255,0.2), 0 15px 40px rgba(0,0,0,0.06);
  }

  .hero-bg::before { content:''; position:absolute; top:0; left:0; right:0; bottom:0;
    background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); opacity:0.02; pointer-events:none;
  }

  .hero-name { font-family: 'Amatic SC', cursive !important; font-size: 6rem; font-weight: 700;
    line-height: 1; letter-spacing: -1px; background: linear-gradient(90deg, #9E8472, #DDDAD3, #9E8472);
    background-size: 200% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: shine 3s ease-in-out infinite; margin-bottom: 0.5rem; text-align:center;
  }
  @keyframes shine { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }

  .hero-line { opacity:0; filter:blur(8px); transform: translateY(30px); transition:opacity 0.7s ease, filter 0.7s ease, transform 0.7s ease; }
  .hero-line.active { opacity:1; filter:blur(0); transform:translateY(0); }

  .hero-subtitle { font-family:'Raleway',sans-serif; font-size:2rem; font-weight:600; color:#9E8472; }
  .hero-text { font-size:1.125rem; line-height:1.7; max-width:600px; text-align:center; margin-top:1rem; }

  .contact-card { background: rgba(221,218,211,0.95); border-radius:12px; padding:2rem; margin:2rem auto; max-width:500px; box-shadow:0 10px 20px rgba(0,0,0,0.06); text-align:center; }
  .contact-card a { font-size:2rem; color:#4C392D; transition: color 0.3s; }
  .contact-card a:hover { color:#9E8472; }
</style>
</head>

<body>
<nav class="fixed top-0 left-0 right-0 z-50 shadow-sm">
  <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
    <a href="index.html" class="text-xl font-semibold">Jenna Orr</a>
    <div class="hidden md:flex space-x-8">
      <a href="index.html" class="hover:text-accent transition">About</a>
      <a href="experience.html" class="hover:text-accent transition">Experience</a>
      <a href="contact.html" class="text-accent font-medium">Contact</a>
    </div>
    <button id="menu-btn" class="md:hidden focus:outline-none"><i class="fas fa-bars text-xl"></i></button>
  </div>
  <div id="mobile-menu" class="md:hidden bg-[#DDDAD3] px-6 pb-4 flex flex-col space-y-4">
    <a href="index.html">About</a>
    <a href="experience.html">Experience</a>
    <a href="contact.html" class="text-accent font-medium">Contact</a>
  </div>
</nav>

<main class="pt-24 pb-16">
  <section class="hero-bg">
    <h1 class="hero-line hero-name">Contact</h1>
    <h2 class="hero-line hero-subtitle">Let's Connect</h2>
    <div class="hero-line hero-text space-y-6">
      <p>Feel free to reach out to me through email or LinkedIn. I’m always open to new opportunities and collaborations!</p>
    </div>
  </section>

  <div class="section-divider"></div>

  <section>
    <div class="contact-card">
      <a href="mailto:jenna@example.com"><i class="fas fa-envelope"></i></a>
      <a href="https://www.linkedin.com/in/jennaeorr" target="_blank"><i class="fab fa-linkedin ml-6"></i></a>
    </div>
  </section>
</main>

<footer class="bg-[#DDDAD3] py-8">
  <div class="container mx-auto px-6 text-center">
    <p>&copy; 2025 Jenna Orr. All rights reserved.</p>
  </div>
</footer>

<script>
document.getElementById("menu-btn").addEventListener("click", () => {
  const menu = document.getElementById("mobile-menu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
});

const heroLines = document.querySelectorAll('.hero-line');
function animateHero() {
  const trigger = window.innerHeight * 0.85;
  heroLines.forEach((line, i) => {
    if (line.getBoundingClientRect().top < trigger) {
      setTimeout(() => line.classList.add('active'), i * 250);
    }
  });
}
window.addEventListener('scroll', animateHero);
window.addEventListener('load', animateHero);
</script>

</body>
</html>
